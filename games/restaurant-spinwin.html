<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin & Win — The Test Kitchen</title>
<style>
/* ====== BRAND / CONFIG (change these to rebrand for any restaurant) ====== */
:root{
  --brand:#B21F2D;        /* primary (restaurant accent) */
  --brand-2:#7A1420;      /* darker */
  --gold:#E9B44C;         /* prize gold */
  --ink:#22181A;          /* text */
  --cream:#FFF7EC;        /* light bg */
  --card:#FFFFFF;
  --muted:#8A7F7B;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);
  background:radial-gradient(120% 80% at 50% -10%, #C7304A 0%, var(--brand) 38%, var(--brand-2) 100%);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:18px 16px 26px;overflow-x:hidden;}
.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;}
.logo{width:64px;height:64px;border-radius:16px;background:var(--cream);display:flex;align-items:center;justify-content:center;
  font-size:34px;box-shadow:0 6px 16px rgba(0,0,0,.25);}
.rest{color:#fff;font-weight:800;font-size:20px;letter-spacing:.02em;margin-top:10px;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.3);}
.head{color:#FFE9C2;font-size:14px;margin-top:2px;text-align:center;}
.h1{color:#fff;font-weight:900;font-size:30px;margin-top:12px;text-align:center;line-height:1.05;text-shadow:0 3px 10px rgba(0,0,0,.35);}
.h1 .g{color:var(--gold);}
.sub{color:#FFE9C2;font-size:14px;margin-top:6px;text-align:center;}

/* wheel */
.stage{position:relative;width:min(320px, calc(100vw - 64px));aspect-ratio:1;margin:18px 0 6px;}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:5;
  width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:26px solid var(--gold);
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));}
canvas{width:100%;height:100%;}
canvas{border-radius:50%;box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 0 8px rgba(255,255,255,.15),0 0 0 14px var(--gold);
  background:#fff;display:block;}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;
  background:var(--cream);border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px;z-index:4;box-shadow:0 3px 8px rgba(0,0,0,.3);}

.spinbtn{margin-top:16px;width:100%;max-width:320px;background:var(--gold);color:#3a2a06;border:none;border-radius:16px;
  padding:18px;font-size:20px;font-weight:900;letter-spacing:.04em;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.3);transition:transform .08s;}
.spinbtn:active{transform:scale(.97);}
.spinbtn:disabled{opacity:.55;cursor:not-allowed;}
.foot{margin-top:16px;color:#FFD9A0;font-size:12px;text-align:center;opacity:.9;}
.foot b{color:#fff;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,6,10,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:20;}
.overlay.show{display:flex;}
.modal{background:var(--card);border-radius:22px;width:100%;max-width:380px;padding:26px 22px;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.4);animation:pop .35s cubic-bezier(.2,1.3,.4,1);}
@keyframes pop{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal .win{font-size:44px;}
.modal h2{font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;}
.modal .prize{font-size:28px;font-weight:900;color:var(--brand);margin:6px 0 4px;line-height:1.1;}
.modal p{font-size:14px;color:var(--muted);margin-bottom:14px;}
.field{text-align:left;margin-bottom:12px;}
.field label{font-size:12px;font-weight:700;color:var(--ink);display:block;margin-bottom:5px;}
.field input{width:100%;padding:13px 14px;border:1.5px solid #E3DAD5;border-radius:12px;font-size:16px;outline:none;}
.field input:focus{border-color:var(--brand);}
.claim{width:100%;background:var(--brand);color:#fff;border:none;border-radius:14px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;margin-top:4px;}
.claim:active{transform:scale(.98);}
.err{color:var(--brand);font-size:12px;margin:-6px 0 10px;text-align:left;display:none;}

/* redeem screen */
.code-box{background:var(--cream);border:2px dashed var(--gold);border-radius:16px;padding:18px;margin:14px 0;}
.code{font-size:30px;font-weight:900;letter-spacing:.18em;color:var(--brand);}
.expire{font-size:12px;color:var(--muted);margin-top:6px;}
.note{font-size:13px;color:var(--ink);background:#FFF2CE;border-radius:12px;padding:12px;margin-top:6px;font-weight:600;}
.tiny{font-size:11px;color:var(--muted);margin-top:14px;}
.pill{display:inline-block;background:#FFF2CE;color:#7a5a00;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;margin-top:8px;}
</style>
<link rel="stylesheet" href="game-fixes.css">
</head>
<body class="bb-demo bb-standard">
<div class="wrap">
  <div class="logo" id="logo">🍜</div>
  <div class="rest" id="restName">The Test Kitchen</div>
  <div class="head">Dine-in Rewards</div>
  <h1 class="h1">Spin &amp; <span class="g">Win!</span></h1>
  <div class="sub">One free spin — win a treat on your next visit 🎁</div>

  <div class="stage">
    <div class="pointer"></div>
    <canvas id="wheel" width="320" height="320"></canvas>
    <div class="hub">🍴</div>
  </div>

  <button class="spinbtn" id="spinBtn">SPIN THE WHEEL</button>
  <div class="foot">Demo rewards · <b>Powered by LabX Co</b></div>
</div>

<!-- WIN / LEAD CAPTURE -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ================== CONFIG ================== */
const RESTAURANT = "The Test Kitchen";
const LOGO = "🍜";
// prize: label shown, short (for wheel), weight (higher = more common), emoji
const PRIZES = [
  { short:"Free\nDessert",   label:"a FREE Dessert",         weight:3, emoji:"🍰" },
  { short:"10% OFF",         label:"10% OFF your bill",       weight:5, emoji:"💸" },
  { short:"Free\nDrink",     label:"a FREE Drink",            weight:4, emoji:"🥤" },
  { short:"Buy 1\nFree 1",   label:"BUY 1 FREE 1 main",       weight:1, emoji:"🍜" },
  { short:"Free\nSide",      label:"a FREE Side dish",        weight:4, emoji:"🍟" },
  { short:"RM50\nVoucher",   label:"a RM50 Voucher",          weight:1, emoji:"🎟️" },
  { short:"5% OFF",          label:"5% OFF your bill",        weight:5, emoji:"🏷️" },
  { short:"Try\nAgain?",     label:"nothing this time",       weight:2, emoji:"🎲", lose:true },
];
const VALID_DAYS = 7;
const ONE_PLAY = false; // set false to allow replays (for demoing)
/* ============================================ */

document.getElementById('restName').textContent = RESTAURANT;
document.getElementById('logo').textContent = LOGO;
document.title = "Spin & Win — " + RESTAURANT;

const cv = document.getElementById('wheel'), ctx = cv.getContext('2d');
const N = PRIZES.length, R = 160, cx = 160, cy = 160;
const seg = (2*Math.PI)/N;
const palette = ['#B21F2D','#E9B44C','#7A1420','#D98324','#8C1C2A','#C7304A','#B8862B','#5B6B7B'];

function draw(rot=0){
  ctx.clearRect(0,0,320,320);
  for(let i=0;i<N;i++){
    const a0 = rot + i*seg, a1 = a0+seg;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,a0,a1); ctx.closePath();
    ctx.fillStyle = palette[i%palette.length]; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2; ctx.stroke();
    // label
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(a0+seg/2);
    ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.font='bold 14px Segoe UI';
    const lines = PRIZES[i].short.split('\n');
    ctx.save(); ctx.translate(R-16,0);
    lines.forEach((ln,k)=>ctx.fillText(ln, 0, (k-(lines.length-1)/2)*15));
    ctx.restore();
    ctx.font='16px Segoe UI'; ctx.textAlign='right'; ctx.fillText(PRIZES[i].emoji, R-16, -22);
    ctx.restore();
  }
}
draw(0);

// weighted pick
function pickIndex(){
  const total = PRIZES.reduce((s,p)=>s+p.weight,0);
  let r = Math.random()*total;
  for(let i=0;i<N;i++){ r-=PRIZES[i].weight; if(r<0) return i; }
  return 0;
}

let spinning=false, curRot=0;
const btn = document.getElementById('spinBtn');

if(ONE_PLAY && localStorage.getItem('bb_spun')){
  btn.disabled=true; btn.textContent="You've already played 🎉";
}

btn.addEventListener('click', ()=>{
  if(spinning) return;
  if(ONE_PLAY && localStorage.getItem('bb_spun')) return;
  spinning=true; btn.disabled=true; btn.textContent="Spinning…";
  const idx = pickIndex();
  // target: pointer at top (−90°). center of seg idx should land under pointer.
  const segCenter = idx*seg + seg/2;
  const target = (-Math.PI/2) - segCenter; // rotation so seg center is at top
  const spins = 6; // full turns
  const finalRot = target - 2*Math.PI*spins - (curRot % (2*Math.PI));
  const start = curRot, delta = finalRot - start, dur = matchMedia("(prefers-reduced-motion: reduce)").matches?1:4200, t0 = performance.now();
  function anim(t){
    const p = Math.min((t-t0)/dur,1);
    const ease = 1 - Math.pow(1-p,3);
    curRot = start + delta*ease;
    draw(curRot);
    if(p<1){ requestAnimationFrame(anim); }
    else { spinning=false; if(ONE_PLAY) localStorage.setItem('bb_spun','1'); showWin(idx); }
  }
  requestAnimationFrame(anim);
});

function showWin(idx){
  if(!ONE_PLAY){btn.disabled=false;btn.textContent="SPIN AGAIN";}
  const prize = PRIZES[idx];
  const modal = document.getElementById('modal');
  if(prize.lose){
    modal.innerHTML = `<div class="win">🎲</div><h2>So close!</h2>
      <div class="prize" style="color:var(--muted)">No prize this time</div>
      <p>Come back on your next visit for another spin — a treat is waiting!</p>
      <button class="claim" onclick="closeOverlay()">Okay</button>`;
    document.getElementById('overlay').classList.add('show'); return;
  }
  modal.innerHTML = `
    <div class="win">🎉</div>
    <h2>You won</h2>
    <div class="prize">${prize.emoji} ${prize.label}!</div>
    <p>Enter your details to claim it on your next visit.</p>
    <div class="field"><label for="fName">Name</label><input id="fName" placeholder="Your name" autocomplete="name"></div>
    <div class="field"><label for="fPhone">Phone / WhatsApp</label><input id="fPhone" placeholder="e.g. 012-345 6789" inputmode="tel" autocomplete="tel"></div>
    <div class="err" id="err">Please enter your name and a valid phone number.</div>
    <button class="claim" id="claimBtn">Claim my prize 🎁</button>
    <div class="tiny">Demo only. Use fictional details; they stay in this browser.</div>`;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('claimBtn').addEventListener('click', ()=>submitLead(prize));
}

function submitLead(prize){
  const name=document.getElementById('fName').value.trim();
  const phone=document.getElementById('fPhone').value.trim();
  if(name.length<2 || phone.replace(/\D/g,'').length<8){ document.getElementById('err').style.display='block'; return; }
  // DEMO: store locally. In production this POSTs to a backend / Google Sheet / CRM.
  const lead={name,phone,prize:prize.label,at:new Date().toISOString()};
  const leads=JSON.parse(localStorage.getItem('bb_leads')||'[]'); leads.push(lead); localStorage.setItem('bb_leads',JSON.stringify(leads));
  const code = 'TK-' + Math.random().toString(36).slice(2,6).toUpperCase();
  const exp = new Date(Date.now()+VALID_DAYS*864e5).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  document.getElementById('modal').innerHTML = `
    <div class="win">✅</div>
    <h2>Prize secured, ${name.split(' ')[0]}!</h2>
    <div class="prize" style="font-size:22px">${prize.emoji} ${prize.label}</div>
    <div class="code-box"><div class="code">${code}</div><div class="expire">Valid until ${exp}</div></div>
    <div class="note">📱 Show this screen to our staff to redeem on your next visit.</div>
    <span class="pill">Demo: lead saved locally</span>
    <div class="tiny">In the live version this instantly saves the guest to the restaurant's contact list / CRM.</div>`;
}
function closeOverlay(){ document.getElementById('overlay').classList.remove('show'); }
</script>
</body>
</html>
