<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Redeem Voucher — Busy Biz Solution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="leads-config.js"></script>
<style>
  :root{ --navy:#16324F; --coral:#FF6B5E; --mist:#F7F9FB; --slate:#5B6B7B; --coral-soft:#FFEFED;
         --green:#2FA36B; --green-soft:#EAF7F0; --amber:#B45309; --amber-soft:#FFF4E5; --red:#E5484D; --red-soft:#FDECEC; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Inter',sans-serif; color:var(--navy); background:radial-gradient(circle at 50% 0%, #1f4266, #16324F);
        min-height:100dvh; padding:24px 16px 40px; display:flex; justify-content:center; }
  .wrap{ width:100%; max-width:460px; }
  .card{ background:#fff; border-radius:26px; box-shadow:0 24px 60px rgba(0,0,0,.35); padding:22px 20px; margin-bottom:16px; }
  .brandrow{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .brand{ font-family:'Poppins',sans-serif; font-weight:800; font-size:17px; letter-spacing:-.02em; }
  .brand .dot{ color:var(--coral); }
  .eyebrow{ font-family:'Poppins',sans-serif; font-weight:700; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
            color:var(--coral); background:var(--coral-soft); padding:5px 10px; border-radius:999px; }
  h1{ font-family:'Poppins',sans-serif; font-weight:800; font-size:24px; letter-spacing:-.02em; margin:10px 0 4px; }
  p.sub{ color:var(--slate); font-size:13.5px; line-height:1.5; margin-bottom:14px; }
  label{ display:block; font-size:12px; font-weight:600; color:var(--slate); margin:0 0 6px 2px; }
  input{ width:100%; font-family:'Inter',sans-serif; font-size:16px; border:1.5px solid #d5dde5; border-radius:12px;
         padding:13px 14px; margin-bottom:12px; outline:none; color:var(--navy); }
  input:focus{ border-color:var(--coral); }
  #code{ font-family:'Poppins',sans-serif; font-weight:700; font-size:22px; letter-spacing:.08em; text-transform:uppercase; text-align:center; }
  .row{ display:flex; gap:10px; }
  .btn{ font-family:'Poppins',sans-serif; font-weight:700; font-size:15px; border:none; border-radius:999px; padding:14px 20px;
        width:100%; cursor:pointer; transition:transform .12s ease; }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.55; cursor:wait; }
  .btn-coral{ background:var(--coral); color:#fff; box-shadow:0 10px 22px rgba(255,107,94,.35); }
  .btn-ghost{ background:var(--mist); color:var(--navy); }
  .result{ display:none; border-radius:16px; padding:14px 16px; margin-top:14px; }
  .result.show{ display:block; animation:fadeUp .3s ease both; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
  .result.valid{ background:var(--green-soft); } .result.valid .head{ color:var(--green); }
  .result.done{ background:var(--green-soft); }  .result.done .head{ color:var(--green); }
  .result.used{ background:var(--amber-soft); }  .result.used .head{ color:var(--amber); }
  .result.bad{ background:var(--red-soft); }     .result.bad .head{ color:var(--red); }
  .result .head{ font-family:'Poppins',sans-serif; font-weight:800; font-size:17px; margin-bottom:6px; }
  .result dl{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px; color:var(--slate); }
  .result dt{ font-weight:600; } .result dd{ color:var(--navy); }
  .pinNote{ font-size:11.5px; color:var(--slate); text-align:center; margin-top:10px; }
  .footer{ text-align:center; font-size:11px; color:rgba(255,255,255,.6); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brandrow">
      <div class="brand">busy biz<span class="dot">.</span></div>
      <div class="eyebrow">Staff</div>
    </div>
    <h1>Redeem a voucher</h1>
    <p class="sub">Ask the customer for the code in their email. Check it first, then redeem it once the reward is applied.</p>

    <label for="pin">Staff PIN</label>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="••••">
    <label for="code">Voucher code</label>
    <input type="text" id="code" autocomplete="off" autocapitalize="characters" placeholder="BB-0001">

    <div class="row">
      <button class="btn btn-ghost" id="checkBtn">Check</button>
      <button class="btn btn-coral" id="redeemBtn">Redeem</button>
    </div>
    <div class="pinNote" id="pinNote"></div>

    <div class="result" id="result">
      <div class="head" id="rHead"></div>
      <dl id="rBody"></dl>
    </div>
  </div>
  <div class="footer">Busy Biz Solution · staff use only</div>
</div>

<script>
(function(){
  var cfg = window.LEAD_DEMO || {};
  var pin = document.getElementById("pin"), code = document.getElementById("code");
  var checkBtn = document.getElementById("checkBtn"), redeemBtn = document.getElementById("redeemBtn");
  var result = document.getElementById("result"), rHead = document.getElementById("rHead"), rBody = document.getElementById("rBody");
  var pinNote = document.getElementById("pinNote");

  try{ pin.value = sessionStorage.getItem("bbs_staff_pin") || ""; }catch(e){}
  if (!cfg.SHEET_ENDPOINT){ pinNote.textContent = "Endpoint not configured — see leads-config.js"; checkBtn.disabled = redeemBtn.disabled = true; }

  function show(cls, head, pairs){
    result.className = "result show " + cls;
    rHead.textContent = head;
    rBody.innerHTML = pairs.map(function(p){ return "<dt>" + p[0] + "</dt><dd>" + esc(p[1] || "—") + "</dd>"; }).join("");
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function details(v){
    return [["Reward", v.reward], ["Name", v.name], ["Email", v.email], ["Voucher no.", String(v.voucherNo).padStart(4,"0")],
            ["Issued", v.issued], ["Valid until", v.expires], ["Game", v.game]].concat(v.redeemedAt ? [["Redeemed", v.redeemedAt]] : []);
  }

  function call(action){
    var p = pin.value.trim(), c = code.value.trim();
    if (!p){ show("bad", "Enter the staff PIN", []); return; }
    if (!c){ show("bad", "Enter a voucher code", []); return; }
    try{ sessionStorage.setItem("bbs_staff_pin", p); }catch(e){}
    checkBtn.disabled = redeemBtn.disabled = true;
    pinNote.textContent = action === "redeem" ? "Redeeming…" : "Checking…";

    fetch(cfg.SHEET_ENDPOINT, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
                                body: JSON.stringify({ action:action, pin:p, code:c }), redirect:"follow" })
    .then(function(r){ return r.json(); })
    .then(function(j){
      var v = j.voucher || {};
      if (j.ok && j.status === "valid")        show("valid", "✓ Valid — not yet used", details(v));
      else if (j.ok && j.status === "redeemed_now") show("done", "✓ Redeemed just now", details(v));
      else if (j.ok && j.status === "redeemed") show("used", "Already redeemed", details(v));
      else if (j.ok && j.status === "expired")  show("bad",  "Expired", details(v));
      else if (j.reason === "already_redeemed") show("used", "Already redeemed — do not apply again", details(v));
      else if (j.reason === "expired")          show("bad",  "Expired — cannot redeem", details(v));
      else if (j.reason === "not_found")        show("bad",  "No voucher with code " + (j.code || c), []);
      else if (j.reason === "bad_pin")          show("bad",  "Wrong staff PIN", []);
      else                                      show("bad",  "Something went wrong", [["Detail", j.error || j.reason || "unknown"]]);
    })
    .catch(function(){ show("bad", "Couldn't reach the voucher service", []); })
    .then(function(){ checkBtn.disabled = redeemBtn.disabled = false; pinNote.textContent = ""; });
  }

  checkBtn.addEventListener("click", function(){ call("lookup"); });
  redeemBtn.addEventListener("click", function(){ call("redeem"); });
  code.addEventListener("keydown", function(e){ if (e.key === "Enter") call("lookup"); });
})();
</script>
</body>
</html>
